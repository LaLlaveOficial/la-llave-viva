name: HyperFrames 066 · render y descarga
on:
  push:
    branches: [fix/hyperframes-feedback-066]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyperframes066-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias de prueba
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund hyperframes@0.8.149 gsap@3.14.2 playwright
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v google-chrome
      - name: Contrato y worker privado
        run: node --test tests/video-066.test.mjs tests/video-066-renderer.test.mjs
      - name: MP4 real con HyperFrames
        run: node tests/video-066-render-smoke.mjs
      - name: Formulario, progreso, reintento y descarga
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/hyperframes-http.log 2>&1 &
          for i in $(seq 1 35); do
            curl -fsS http://127.0.0.1:4174/tests/video-066-browser-harness.html >/dev/null && break
            sleep 1
          done
          HYPERFRAME_TEST_MP4=/tmp/hyperframes-test.mp4 node tests/video-066-browser.test.mjs
      - name: Evidencia del archivo y de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes066-render-evidence
          path: |
            /tmp/hyperframes-test.mp4
            /tmp/hyperframes-browser/*.png
          if-no-files-found: ignore
