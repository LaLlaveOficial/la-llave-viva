name: Operación 066 · marketing
on:
  pull_request:
    paths: ['lib/**', 'api/console-066.js', 'api/agent-066.js', 'vercel.json', 'public/centro-066/**', 'migrations/20261016*.sql', 'tests/marketing-workspace*', 'tests/marketing-delivery*', 'tests/customer-mail*', 'tests/manager066*', 'src/ajraz10.js', 'api/create-promo-preference.js', '.github/workflows/marketing066-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dependencias sin credenciales de producción
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.10 playwright@1.62.1
      - name: Pruebas de contratos y seguridad
        run: node --test tests/marketing-workspace.test.mjs tests/console066.test.mjs tests/console-marketing.test.mjs tests/console-metrics.test.mjs tests/agent-data.test.mjs tests/manager-report.test.mjs tests/source-evidence.test.mjs tests/google-ads-reports.test.mjs tests/google-ads-watch.test.mjs tests/houston-routines.test.mjs
      - name: Postgres y handler autenticado
        run: |
          node tests/marketing-workspace-integration.mjs
          node tests/marketing-delivery-integration.mjs
          node tests/customer-mail-integration.mjs
          node tests/manager066-integration.mjs
      - name: Interfaz en navegador
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node tests/marketing-workspace-browser.mjs
          node tests/customer-mail-browser.mjs
          node tests/manager066-browser.mjs
      - name: Compilar
        run: npm run build
